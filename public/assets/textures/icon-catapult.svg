<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="impactGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ff9f1c" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#e63946" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="targetRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c92a2a"/>
    </linearGradient>
    <linearGradient id="arrowMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.5" stop-color="#a8b4c2"/>
      <stop offset="1" stop-color="#6a7686"/>
    </linearGradient>
  </defs>
  <!-- 集火光晕 -->
  <circle cx="256" cy="256" r="200" fill="url(#impactGlow)"/>
  <!-- 靶心（同心环） -->
  <circle cx="256" cy="256" r="110" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="96" fill="#f8f8f8"/>
  <circle cx="256" cy="256" r="74" fill="url(#targetRed)"/>
  <circle cx="256" cy="256" r="40" fill="#f8f8f8"/>
  <circle cx="256" cy="256" r="18" fill="url(#targetRed)"/>
  <!-- 三支箭从外围汇聚靶心 -->
  <!-- 左上箭 -->
  <line x1="70" y1="70" x2="210" y2="210" stroke="#3a1d0a" stroke-width="18" stroke-linecap="round"/>
  <line x1="70" y1="70" x2="210" y2="210" stroke="#c98a4a" stroke-width="10" stroke-linecap="round"/>
  <path d="M210 210 L172 200 L200 238 Z" fill="#3a1d0a"/>
  <path d="M206 206 L180 198 L198 228 Z" fill="url(#arrowMetal)"/>
  <!-- 右上箭 -->
  <line x1="442" y1="70" x2="302" y2="210" stroke="#3a1d0a" stroke-width="18" stroke-linecap="round"/>
  <line x1="442" y1="70" x2="302" y2="210" stroke="#c98a4a" stroke-width="10" stroke-linecap="round"/>
  <path d="M302 210 L340 200 L312 238 Z" fill="#3a1d0a"/>
  <path d="M306 206 L332 198 L314 228 Z" fill="url(#arrowMetal)"/>
  <!-- 下方箭 -->
  <line x1="256" y1="456" x2="256" y2="312" stroke="#3a1d0a" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="456" x2="256" y2="312" stroke="#c98a4a" stroke-width="10" stroke-linecap="round"/>
  <path d="M256 312 L222 344 L290 344 Z" fill="#3a1d0a"/>
  <path d="M256 320 L230 340 L282 340 Z" fill="url(#arrowMetal)"/>
</svg>
