<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bowWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3a1a"/>
      <stop offset="0.45" stop-color="#c98a4a"/>
      <stop offset="0.55" stop-color="#e0a863"/>
      <stop offset="1" stop-color="#6b3a1a"/>
    </linearGradient>
    <linearGradient id="arrowShaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="0.5" stop-color="#c98a4a"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8dde3"/>
      <stop offset="0.5" stop-color="#8a95a3"/>
      <stop offset="1" stop-color="#5a6573"/>
    </linearGradient>
  </defs>
  <!-- 弓身（立体木色） -->
  <path d="M120 56 C 280 110, 280 402, 120 456" stroke="#3a1d0a" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M120 56 C 280 110, 280 402, 120 456" stroke="url(#bowWood)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <!-- 弓弦 -->
  <line x1="120" y1="56" x2="120" y2="456" stroke="#2a1a0a" stroke-width="7" stroke-linecap="round"/>
  <line x1="120" y1="56" x2="120" y2="456" stroke="#d4c090" stroke-width="3" stroke-linecap="round"/>
  <!-- 箭杆 -->
  <line x1="120" y1="80" x2="120" y2="432" stroke="#3a1d0a" stroke-width="14" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="120" y2="432" stroke="url(#arrowShaft)" stroke-width="8" stroke-linecap="round"/>
  <!-- 箭头（金属） -->
  <path d="M120 36 L74 108 L166 108 Z" fill="#3a1d0a"/>
  <path d="M120 44 L84 102 L156 102 Z" fill="url(#metal)"/>
  <!-- 箭羽（红+蓝双色） -->
  <path d="M120 428 L78 380 L120 404 Z" fill="#3a1d0a"/>
  <path d="M120 428 L78 380 L120 404 Z" fill="#c0392b"/>
  <path d="M120 428 L162 380 L120 404 Z" fill="#3a1d0a"/>
  <path d="M120 428 L162 380 L120 404 Z" fill="#2980b9"/>
</svg>
