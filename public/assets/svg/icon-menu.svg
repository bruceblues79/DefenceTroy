<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24">
  <!-- 浅灰底板，让图标从中灰按钮上浮出来 -->
  <circle cx="12" cy="12" r="10" fill="#AAAAAA"/>
  <!-- 外框圆：蓝色描边 -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="#42A5F5" stroke-width="1.5"/>
  <!-- 三条横线：白色填充 -->
  <rect x="5.5" y="6.25" width="13" height="1.5" rx="0.75" fill="#ffffff"/>
  <rect x="5.5" y="11.25" width="13" height="1.5" rx="0.75" fill="#ffffff"/>
  <rect x="5.5" y="16.25" width="13" height="1.5" rx="0.75" fill="#ffffff"/>
</svg>
